name: Pages Health Check

on:
  push:
    branches:
      - Main
  workflow_dispatch:

jobs:
  verify-pages-content:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          if [ ! -f "index.html" ]; then
            echo "ERROR: index.html is missing from repository root"
            exit 1
          fi

      - name: Verify key asset directories
        run: |
          if [ ! -d "js" ]; then
            echo "ERROR: js directory is missing"
            exit 1
          fi
          if [ ! -d "css" ]; then
            echo "ERROR: css directory is missing"
            exit 1
          fi

      - name: Verify generated portrait and broadcast art
        run: |
          portrait_count=$(find images/portraits -maxdepth 1 -name '*.jpg' | wc -l)
          if [ "$portrait_count" -ne 44 ]; then
            echo "ERROR: expected 32 modern and 12 historical candidate portraits, found $portrait_count"
            exit 1
          fi
          for asset in \
            images/broadcast/debate-stage.jpg \
            images/broadcast/election-night-studio.jpg \
            images/broadcast/special-report-studio.jpg; do
            if [ ! -s "$asset" ]; then
              echo "ERROR: required broadcast asset missing: $asset"
              exit 1
            fi
          done
          if ! grep -q "election2028-v27-2d-campaign" service-worker.js; then
            echo "ERROR: service worker cache version was not updated for portrait art"
            exit 1
          fi
